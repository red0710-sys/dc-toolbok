<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home Flow">
  <title>Home Flow｜家庭現金流控制台</title>
  <link rel="stylesheet" href="./style.css?v=hf3-a8f4a71">
  <style id="hero-hotfix">
    .hero{
      background:linear-gradient(145deg,#f1e8dc 0%,#f7efe5 62%,#eee8dc 100%) !important;
      color:#25231f !important;
      border:1px solid #ddd1c2 !important;
      box-shadow:0 12px 30px rgba(79,59,39,.08) !important;
      position:relative;
      overflow:hidden;
    }
    .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#ef6a3a}
    .hero .hero-head small{color:#d95225 !important;font-weight:800;letter-spacing:.08em}
    .hero .hero-head>span,.hero .stat span,.hero .stat small{color:#746f67 !important;opacity:1 !important}
    .hero .stat{border-right:1px solid rgba(92,75,57,.11)}
    .hero .stat:last-child{border-right:0}
    .hero .stat strong{color:#25231f !important}
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div><div class="kicker">HOME FLOW 3.0</div><h1>家庭現金流</h1></div>
      <button id="shareBtn" class="icon-btn" aria-label="分享 Home Flow">↗</button>
    </header>
    <div id="status" class="status">正在開啟 Home Flow…</div>
    <section id="prodUpgrade" style="margin:8px 0 12px;padding:12px 14px;border:1px solid #dfd4c8;border-radius:16px;background:#fffaf3;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div><b style="display:block;font-size:12px">Home Flow 雲端正式版已上線</b><small id="migrateProdNote" style="display:block;margin-top:3px;color:#7b746c">一鍵搬移這台裝置的歷史解鎖與修改資料。</small></div>
      <button id="migrateProdBtn" type="button" style="white-space:nowrap;border:0;border-radius:12px;padding:9px 12px;background:#ef6a3a;color:white;font-weight:800">升級</button>
    </section>
    <main id="content"></main>
  </div>

  <nav class="nav" aria-label="Home Flow 功能列">
    <button data-tab="home" class="active"><span>⌂</span><b>總覽</b></button>
    <button data-tab="add"><span>＋</span><b>記帳</b></button>
    <button data-tab="analysis"><span>◎</span><b>分析</b></button>
    <button data-tab="chat"><span>✦</span><b>AI</b></button>
    <button data-tab="projects"><span>▦</span><b>專案</b></button>
    <button data-tab="list"><span>⌕</span><b>明細</b></button>
  </nav>

  <script type="module" src="./app.js?v=hf3-91e6d6c"></script>
  <script src="./migrate-prod.js?v=1"></script>
</body>
</html>
