<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Home Flow｜兩個人的生活金流</title>
  <link rel="stylesheet" href="./style.css?v=20261004i" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HOME FLOW</div>
        <h1>兩個人的生活金流</h1>
      </div>
      <button id="shareBtn" class="icon-btn" aria-label="分享 Home Flow">↗</button>
    </header>

    <section id="status" class="status">正在開啟加密共用帳本…</section>

    <section class="hero">
      <div class="month-nav">
        <button id="prevMonth" class="quiet-btn" aria-label="上個月">←</button>
        <button id="monthLabel" class="month-label"></button>
        <button id="nextMonth" class="quiet-btn" aria-label="下個月">→</button>
      </div>
      <div class="hero-grid">
        <div><span>本月支出</span><strong id="expenseTotal">$0</strong></div>
        <div><span>本月收入</span><strong id="incomeTotal">$0</strong></div>
        <div><span>本月結餘</span><strong id="balanceTotal">$0</strong></div>
      </div>
      <div id="budgetWrap" class="budget-wrap hidden">
        <div class="budget-copy"><span>預算使用</span><b id="budgetText"></b></div>
        <div class="budget-track"><i id="budgetBar"></i></div>
      </div>
    </section>

    <section class="entry-card">
      <div class="type-toggle" role="group" aria-label="收支類型">
        <button class="type-btn active" data-type="expense">支出</button>
        <button class="type-btn" data-type="income">收入</button>
      </div>

      <div class="amount-row">
        <span class="currency">$</span>
        <input id="amount" class="amount-input" inputmode="decimal" placeholder="0" aria-label="金額" />
      </div>

      <div id="quickCategories" class="quick-categories" aria-label="常用分類"></div>

      <div class="form-grid">
        <div class="field">
          <div class="field-label">付款帳戶 <button type="button" id="editAccountsBtn" class="mini-link">編輯</button></div>
          <select id="account"></select>
        </div>
        <label>分類
          <select id="category"></select>
        </label>
        <label>專案
          <select id="project"></select>
        </label>
        <label>日期
          <input id="date" type="date" />
        </label>
        <label>備註
          <input id="note" maxlength="200" placeholder="店家、內容、補充…" />
        </label>
      </div>

      <button id="saveEntry" class="primary-btn">＋ 記一筆</button>
      <button id="cancelEdit" class="text-btn hidden">取消編輯</button>
    </section>

    <section class="category-card">
      <div class="section-head"><h2>花在哪裡</h2><span>支出分類</span></div>
      <div id="categoryBars" class="category-bars"></div>
    </section>

    <section class="list-card">
      <div class="section-head">
        <div>
          <h2>明細</h2>
          <select id="projectFilter" class="inline-filter" aria-label="專案篩選"></select>
        </div>
        <button id="exportBtn" class="text-btn">匯出 CSV</button>
      </div>
      <div id="entries" class="entries"></div>
    </section>

    <footer>Home Flow · Shared life. Shared flow.</footer>
  </main>
  <script type="module" src="./app.js?v=20261004i"></script>
</body>
</html>
