<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="description" content="台灣美食地圖：Google Maps 收藏整理、吃過紀錄、備註與今天吃什麼推薦。" />
  <title>Taiwan Food Map</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #08090b;
  --panel: #111216;
  --panel-2: #17181d;
  --line: #292b31;
  --text: #f5f5f3;
  --muted: #999ca5;
  --accent: #ff7a00;
  --accent-2: #ffb000;
  --good: #a7e35d;
  --danger: #ff625f;
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
body { background: radial-gradient(circle at 20% -10%, rgba(255,122,0,.13), transparent 26rem), var(--bg); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { width: min(1460px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 44px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.5rem, 2.7vw, 2.45rem); letter-spacing: -.045em; }
h2 { font-size: 1.05rem; letter-spacing: -.02em; }
.eyebrow, .kicker { color: var(--accent); font-size: .68rem; letter-spacing: .16em; font-weight: 800; }
.card { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.hero-grid { display: grid; grid-template-columns: 1.65fr .75fr; gap: 14px; margin-bottom: 14px; }
.today-card, .stats-card, .toolbar, .list-card { padding: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.section-head.compact { align-items: center; }
.soft-pill { color: #d7d8dc; background: #202126; border: 1px solid #2d2f35; border-radius: 999px; padding: 6px 9px; font-size: .72rem; white-space: nowrap; }
.today-result { min-height: 118px; padding: 18px; border-radius: 14px; border: 1px solid #2b2d33; background: linear-gradient(135deg, #191a1f, #101115); display: flex; gap: 15px; align-items: center; }
.today-result.empty { color: var(--muted); }
.today-result p { margin-top: 5px; color: var(--muted); font-size: .88rem; }
.today-result .today-name { font-size: clamp(1.2rem, 2vw, 1.75rem); font-weight: 850; letter-spacing: -.035em; color: var(--text); }
.today-icon { width: 52px; height: 52px; border-radius: 15px; background: #23242a; display: grid; place-items: center; font-size: 1.7rem; flex: 0 0 auto; }
.today-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.today-actions { display: flex; gap: 10px; margin-top: 12px; }
.today-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.today-filters select { width: 100%; }
.rating-stars { letter-spacing: .04em; color: var(--accent-2); font-weight: 900; }
.return-yes { color: var(--good); }
.return-no { color: #ff9997; }
.btn { border: 1px solid transparent; border-radius: 12px; min-height: 42px; padding: 0 14px; font-weight: 780; color: var(--text); background: transparent; transition: .18s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { color: #0a0a0a; background: linear-gradient(120deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 28px rgba(255,122,0,.18); }
.btn-ghost { background: #1b1c21; border-color: #30323a; }
.btn-danger { background: rgba(255,98,95,.10); border-color: rgba(255,98,95,.3); color: #ff9997; }
.stats-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.stat { min-height: 76px; border-radius: 14px; border: 1px solid #292b31; background: #15161a; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.stat span { color: var(--muted); font-size: .78rem; }
.stat strong { font-size: 1.45rem; }
.sync-status { grid-column: 1 / -1; padding: 10px 12px; color: var(--muted); font-size: .78rem; display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(167,227,93,.08); }
.toolbar { margin-bottom: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.region-tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
.region-tabs::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; border: 1px solid #2d2f35; background: #17181c; color: #b6b8c0; border-radius: 999px; padding: 8px 11px; }
.chip.active { color: #0a0a0a; border-color: var(--accent); background: var(--accent); font-weight: 850; }
.filters-row { display: flex; gap: 8px; align-items: center; }
.search-wrap { height: 42px; width: min(320px, 32vw); display: flex; align-items: center; gap: 8px; border: 1px solid #30323a; background: #17181c; border-radius: 12px; padding: 0 11px; color: var(--muted); }
.search-wrap input { min-width: 0; width: 100%; background: transparent; border: 0; outline: 0; color: var(--text); }
select, .field input, .field textarea { color: var(--text); background: #17181c; border: 1px solid #30323a; border-radius: 12px; min-height: 42px; padding: 0 10px; outline: none; }
.field textarea { min-height: 92px; padding-top: 10px; resize: vertical; }
.content-grid { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) {
  .app-shell { width: min(100% - 18px, 760px); padding-top: 12px; }
  .hero-grid, .content-grid { grid-template-columns: 1fr; }
  .toolbar { align-items: stretch; flex-direction: column; }
  .filters-row { width: 100%; }
  .search-wrap { width: 100%; flex: 1; }
  .list-card { order: 1; }
  #map { height: 52vh; min-height: 360px; }
  .place-list { height: auto; min-height: 0; max-height: none; }
}
@media (max-width: 560px) {
  .topbar .btn { min-height: 38px; padding: 0 10px; font-size: .78rem; }
  .hero-grid { gap: 10px; }
  .today-card, .stats-card, .toolbar, .list-card { padding: 14px; }
  .today-actions .btn { flex: 1; }
  .filters-row { display: grid; grid-template-columns: 1fr 1fr; }
  .search-wrap { grid-column: 1 / -1; }
  .filters-row .btn, .filters-row select { width: 100%; }
  .field-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .modal { padding: 16px; }
  .content-grid { gap: 10px; }
}


/* Beta 1.2 — hierarchical filters + compact accordion browsing */
.toolbar { margin-bottom:14px; display:flex; flex-direction:column; gap:12px; align-items:stretch; }
.filter-block { display:grid; gap:8px; }
.filter-line { display:flex; align-items:center; gap:9px; min-width:0; }
.filter-label { width:54px; flex:0 0 54px; color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.04em; }
.region-tabs, .sub-tabs, .city-tabs, .type-tabs, .city-jump { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:1px; }
.region-tabs::-webkit-scrollbar, .sub-tabs::-webkit-scrollbar, .city-tabs::-webkit-scrollbar, .type-tabs::-webkit-scrollbar, .city-jump::-webkit-scrollbar { display:none; }
.sub-tabs:empty, .city-tabs:empty { display:none; }
.filters-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.filters-row select { min-width:132px; }
.place-group { margin-bottom:11px; scroll-margin-top:14px; }
.place-group-title { position:sticky; top:0; z-index:3; padding:0; background:var(--panel); border-bottom:1px solid #292b31; }
.group-toggle { width:100%; min-height:48px; border:0; background:transparent; color:var(--accent-2); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px; font-size:.78rem; font-weight:900; letter-spacing:.06em; text-align:left; }
.group-toggle .group-arrow { color:var(--muted); font-size:.9rem; transition:.16s ease; }
.group-toggle.open .group-arrow { transform:rotate(180deg); }
.city-jump { margin:-2px 0 12px; padding:2px 0 6px; }
.jump-chip { border:1px solid #2d2f35; background:#15161a; color:#c8c9ce; border-radius:999px; padding:7px 10px; font-size:.72rem; white-space:nowrap; }
.group-more { width:100%; margin-top:7px; border:1px solid #30323a; background:#17181c; color:#c8c9ce; border-radius:11px; min-height:38px; font-weight:760; }
.place-item { padding:10px 2px; }
@media (max-width:900px) {
  .filter-label { width:46px; flex-basis:46px; }
  .search-wrap { flex:1 1 100%; }
}
@media (max-width:560px) {
  .filter-line { align-items:flex-start; }
  .filter-label { padding-top:8px; }
  .filters-row select { min-width:0; }
}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL FOOD OS</div>
        <h1>Taiwan Food Map</h1>
      </div>
      <button id="syncBtn" class="btn btn-primary" type="button">Google Maps 清單</button>
    </header>

    <main>
      <section class="hero-grid">
        <article class="card today-card">
          <div class="section-head">
            <div>
              <span class="kicker">TODAY</span>
              <h2>今天要吃啥？</h2>
            </div>
            <span id="candidateCount" class="soft-pill">0 家可選</span>
          </div>
          <div id="todayResult" class="today-result empty">
            <div class="today-icon">🍜</div>
            <div>
              <strong>共享清單已載入</strong>
              <p>先選區域，再用系統推薦或純隨機抽一間。</p>
            </div>
          </div>
          <div class="today-filters">
            <select id="todayCityFilter" aria-label="今天吃啥區域">
              <option value="全部">全台</option>
              <option value="基隆">基隆</option>
              <option value="清水">清水</option>
              <option value="梧棲">梧棲</option>
              <option value="彰化">彰化</option>
              <option value="嘉義">嘉義</option>
              <option value="台南">台南</option>
              <option value="高雄">高雄</option>
              <option value="東部">東部</option>
            </select>
            <select id="todayStatusFilter" aria-label="今天吃啥條件">
              <option value="全部">全部</option>
              <option value="想吃">想吃</option>
              <option value="沒吃過">沒吃過</option>
            </select>
          </div>
          <div class="today-actions">
            <button id="recommendBtn" class="btn btn-primary" type="button">✨ 系統推薦</button>
            <button id="randomBtn" class="btn btn-ghost" type="button">🎲 隨機推</button>
          </div>
        </article>

        <article class="card stats-card">
          <div class="stat"><span>收藏</span><strong id="totalStat">0</strong></div>
          <div class="stat"><span>吃過</span><strong id="eatenStat">0</strong></div>
          <div class="stat"><span>想吃</span><strong id="wantStat">0</strong></div>
          <div class="stat"><span>有備註</span><strong id="noteStat">0</strong></div>
          <div class="sync-status">
            <span class="dot"></span>
            <span id="lastSyncText">尚未同步</span>
          </div>
        </article>
      </section>

      <section class="toolbar card">
        <div class="filter-block">
          <div class="filter-line">
            <span class="filter-label">地區</span>
            <div class="region-tabs" id="regionTabs">
              <button class="chip active" data-region="全部">全部</button>
              <button class="chip" data-region="北部">北部</button>
              <button class="chip" data-region="中部">中部</button>
              <button class="chip" data-region="南部">南部</button>
              <button class="chip" data-region="東部">東部</button>
            </div>
          </div>
          <div class="filter-line" id="areaFilterLine">
            <span class="filter-label">生活圈</span>
            <div class="sub-tabs" id="areaTabs"></div>
          </div>
          <div class="filter-line" id="cityFilterLine">
            <span class="filter-label">城市</span>
            <div class="city-tabs" id="cityTabs"></div>
          </div>
          <div class="filter-line">
            <span class="filter-label">類型</span>
            <div class="type-tabs" id="typeTabs">
              <button class="chip active" data-food-type="全部">全部</button>
              <button class="chip" data-food-type="早餐">早餐</button>
              <button class="chip" data-food-type="小吃">小吃</button>
              <button class="chip" data-food-type="麵飯">麵飯</button>
              <button class="chip" data-food-type="火鍋">火鍋</button>
              <button class="chip" data-food-type="燒烤">燒烤</button>
              <button class="chip" data-food-type="海鮮">海鮮</button>
              <button class="chip" data-food-type="甜點飲料">甜點飲料</button>
              <button class="chip" data-food-type="正餐">正餐</button>
              <button class="chip" data-food-type="宵夜">宵夜</button>
            </div>
          </div>
        </div>

        <div class="filters-row">
          <label class="search-wrap">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="搜尋店名、城市、備註…" autocomplete="off" />
          </label>
          <select id="statusFilter" aria-label="狀態篩選">
            <option value="全部">全部狀態</option>
            <option value="沒吃過">沒吃過</option>
            <option value="吃過">吃過</option>
            <option value="想吃">想吃</option>
            <option value="會再吃">會再吃</option>
            <option value="不再吃">不再吃</option>
            <option value="30天內">30天內吃過</option>
          </select>
          <select id="myRatingFilter" aria-label="我的評分">
            <option value="全部">全部星級</option>
            <option value="未評分">未評分</option>
            <option value="5">我的 5★</option>
            <option value="4+">我的 4★+</option>
            <option value="3-">我的 ≤3★</option>
          </select>
          <select id="googleFilter" aria-label="Google 人氣">
            <option value="全部">Google 人氣</option>
            <option value="4.5+">Google 4.5★+</option>
            <option value="4.0+">Google 4.0★+</option>
            <option value="1000+">評論 1000+</option>
          </select>
          <button id="addBtn" class="btn btn-ghost" type="button">＋ 新增</button>
        </div>
      </section>

      <section class="content-grid">

        <article class="card list-card">
          <div class="section-head compact">
            <div>
              <span class="kicker">PLACES</span>
              <h2>北到南</h2>
            </div>
            <span id="visibleCount" class="soft-pill">0 家</span>
          </div>
          <div id="placeList" class="place-list"></div>
        </article>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <input id="zipInput" type="file" accept=".zip" hidden />
  <input id="restoreInput" type="file" accept=".json,application/json" hidden />

  function hydrateSharedData(base) {
    const old = new Map((base.places || []).map(p => [p.id, p]));
    const srcByKey = new Map(SHARED_SOURCES.map(s => [s.key, s]));
    const shared = SHARED_SEED.map(item => {
      const src = srcByKey.get(item.sourceKey);
      const id = sharedPlaceId(item.sourceKey, item.title);
      const prev = old.get(id);
      return {
        id,
        title: item.title,
        city: item.city,
        region: item.region,
        kind: item.kind,
        rating: Number.isFinite(item.rating) ? item.rating : null,
        reviews: Number.isFinite(item.reviews) ? item.reviews : null,
        sourceKey: item.sourceKey,
        sourceLists: [src?.label || item.city],
        sourceUrl: src?.url || '',
        url: mapsSearchUrl(item.title, item.city),
        note: '',
        comment: '',
        localNote: prev?.localNote || '',
        eaten: !!prev?.eaten,
        myRating: Number.isFinite(prev?.myRating) ? prev.myRating : null,
        wouldReturn: prev?.wouldReturn || '',
        lastEatenAt: prev?.lastEatenAt || null,
        manual: false,
        removed: false
      };
    });
    const manual = (base.places || []).filter(p => p.manual);
    const next = {
      ...base,
      places: dedupePlaces([...shared, ...manual]),
      lastSync: SHARED_DATA_UPDATED_AT,
      sharedVersion: SHARED_DATA_VERSION
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch {}
    return next;
  }

  function sharedPlaceId(sourceKey, title) {
    return 'shared:' + sourceKey + ':' + String(title || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function mapsSearchUrl(title, city) {
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([title, city].filter(Boolean).join(' '));
  }

  function defaultState() {
    return { version: 1, places: [], lastSync: null, lastImportName: null };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState();
    } catch { return defaultState(); }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

  function renderHierarchyFilters() {
    const current = state.places.filter(p => !p.removed && isFoodPlace(p));
    const regionCities = new Set(current.filter(p => activeRegion === '全部' || p.region === activeRegion).map(p => p.city));
    const areaLine = document.getElementById('areaFilterLine');
    const cityLine = document.getElementById('cityFilterLine');

    if (activeRegion === '全部') {
      activeArea = '全部';
      activeCity = '全部';
      els.areaTabs.innerHTML = '';
      els.cityTabs.innerHTML = '';
      if (areaLine) areaLine.style.display = 'none';
      if (cityLine) cityLine.style.display = 'none';
      return;
    }

    if (areaLine) areaLine.style.display = 'flex';
    const areas = Object.entries(AREA_META[activeRegion] || {}).filter(([,cities]) => cities.some(city => regionCities.has(city)));
    els.areaTabs.innerHTML = [
      `<button class="chip ${activeArea==='全部'?'active':''}" data-area="全部">全部</button>`,
      ...areas.map(([area]) => `<button class="chip ${activeArea===area?'active':''}" data-area="${escapeAttr(area)}">${escapeHtml(area)}</button>`)
    ].join('');

    if (activeArea === '全部') {
      activeCity = '全部';
      els.cityTabs.innerHTML = '';
      if (cityLine) cityLine.style.display = 'none';
      return;
    }

    const cities = (AREA_META[activeRegion]?.[activeArea] || []).filter(city => regionCities.has(city));
    if (cities.length <= 1) {
      activeCity = cities[0] || '全部';
      els.cityTabs.innerHTML = '';
      if (cityLine) cityLine.style.display = 'none';
      if (activeCity !== '全部') expandedCities.add(activeCity);
      return;
    }

    if (cityLine) cityLine.style.display = 'flex';
    els.cityTabs.innerHTML = [
      `<button class="chip ${activeCity==='全部'?'active':''}" data-city="全部">全部</button>`,
      ...cities.map(city => `<button class="chip ${activeCity===city?'active':''}" data-city="${escapeAttr(city)}">${escapeHtml(city)}</button>`)
    ].join('');
  }

  function isFoodPlace(p) {
    if (p.kind === 'family') return false;
    if (p.forceFood === true) return true;
    if (p.forceFood === false) return false;
    const t = String(p.title || '').toLowerCase();
    const nonFood = [
      /停車場/, /圖書館/, /親子館/, /運動廣場/, /gas station/, /加油站/,
      /製鍋/, /漁港/, /seafood wholesaler/, /休閒農場/, /博物館/, /7-eleven/,
      /便利商店/, /(^|[^餐])公園$/, /河樂廣場/, /釣魚場/
    ];
    return !nonFood.some(re => re.test(t));
  }

  function getFilteredPlaces() {
    return state.places.filter(p => !p.removed && isFoodPlace(p)).filter(p => {
      if (activeRegion !== '全部' && (p.region || '待分類') !== activeRegion) return false;
      if (activeArea !== '全部') {
        const cities = AREA_META[activeRegion]?.[activeArea] || [];
        if (!cities.includes(p.city)) return false;
      }
      if (activeCity !== '全部' && p.city !== activeCity) return false;
      if (activeFoodType !== '全部' && !matchesFoodType(p, activeFoodType)) return false;

      const eaten = p.eaten || hasList(p, '吃過');
      if (activeStatus === '沒吃過' && eaten) return false;
      if (activeStatus === '吃過' && !eaten) return false;
      if (activeStatus === '想吃' && eaten && p.wouldReturn !== 'yes') return false;
      if (activeStatus === '會再吃' && p.wouldReturn !== 'yes') return false;
      if (activeStatus === '不再吃' && p.wouldReturn !== 'no') return false;
      if (activeStatus === '30天內' && !isRecentEaten(p)) return false;

      if (activeMyRating === '未評分' && Number.isFinite(p.myRating)) return false;
      if (activeMyRating === '5' && p.myRating !== 5) return false;
      if (activeMyRating === '4+' && !(Number.isFinite(p.myRating) && p.myRating >= 4)) return false;
      if (activeMyRating === '3-' && !(Number.isFinite(p.myRating) && p.myRating <= 3)) return false;

      if (activeGoogle === '4.5+' && !(Number.isFinite(p.rating) && p.rating >= 4.5)) return false;
      if (activeGoogle === '4.0+' && !(Number.isFinite(p.rating) && p.rating >= 4.0)) return false;
      if (activeGoogle === '1000+' && !(Number.isFinite(p.reviews) && p.reviews >= 1000)) return false;

      if (searchTerm) {
        const hay = [p.title, p.city, p.localNote, p.note, p.comment, ...(p.sourceLists || [])].join(' ').toLowerCase();
        if (!hay.includes(searchTerm)) return false;
      }
      return true;
    }).sort(placeSort);
  }

  function matchesFoodType(p, type) {
    const t = String(p.title || '').toLowerCase();
    const tests = {
      '早餐': /早餐|早午餐|飯糰|蛋餅|燒餅|水煎包|生煎包|饅頭|包子|吐司|三明治|刈包/,
      '小吃': /小吃|臭豆腐|雞排|香腸|滷味|肉圓|鹹酥|蔥油餅|麵線羹|切仔|米苔目|豬血|米粿|雞子粿|筒仔米糕/,
      '麵飯': /麵|飯|粥|炒飯|米糕|冬粉|水餃|煎餃|粽|肉燥|魯肉|滷肉|豬腳|米粉|意麵|鱔魚|餛飩/,
      '火鍋': /火鍋|鍋物|涮涮|沙茶爐|羊肉爐|臭臭鍋|泡菜鍋|鮮鍋/,
      '燒烤': /燒烤|烤鴨|桶仔雞|烤玉米|燒肉|碳火|炭火|烤雞/,
      '海鮮': /海鮮|水產|活蝦|螃蟹|蚵|虱目魚|魚羹|𩵚魠|鴨肉羹/,
      '甜點飲料': /豆花|冰|甜|麻糬|綠豆沙|仙草|紅茶|茶行|飲料|咖啡|café|刨冰|粉圓|愛玉/,
      '宵夜': /宵夜|鹹酥|雞排|滷味|臭豆腐|熱炒|燒烤|烤鴨|酒館|bistro/,
      '正餐': /餐廳|食堂|料理|牛排|土雞|牛肉爐|火鍋|鍋物|海鮮|餐酒|bistro|cuisine/
    };
    return tests[type]?.test(t) || false;
  }

  function getTodayCandidates() {
    return state.places.filter(p => !p.removed && isFoodPlace(p)).filter(p => {
      if (todayCity !== '全部' && (p.city || '') !== todayCity) return false;
      const eaten = p.eaten || hasList(p, '吃過');
      if (todayStatus === '沒吃過' && eaten) return false;
      if (todayStatus === '想吃' && eaten && p.wouldReturn !== 'yes') return false;
      return true;
    });
  }

  function daysSinceLastEaten(p) {
    if (!p.lastEatenAt) return Infinity;
    const ms = Date.now() - new Date(p.lastEatenAt).getTime();
    return Number.isFinite(ms) ? ms / 86400000 : Infinity;
  }

  function isRecentEaten(p) {
    return daysSinceLastEaten(p) < 30;
  }

  function placeSort(a, b) {
    const ra = REGION_ORDER.indexOf(a.region || '待分類');
    const rb = REGION_ORDER.indexOf(b.region || '待分類');
    if (ra !== rb) return ra - rb;
    const ca = citySortKey(a.city), cb = citySortKey(b.city);
    if (ca !== cb) return ca - cb;
    return (a.title || '').localeCompare(b.title || '', 'zh-Hant');
  }

  function citySortKey(city) {
    const order = ['基隆','台北','新北','桃園','新竹','苗栗','大甲','清水','梧棲','沙鹿','台中','彰化','南投','雲林','嘉義','台南','高雄','屏東','宜蘭','花蓮','台東','東部','待分類'];
    const idx = order.indexOf(city || '待分類'); return idx < 0 ? 999 : idx;
  }

  function renderPlaces(list) {
    if (!list.length) {
      els.placeList.innerHTML = `<div class="empty-list">沒有符合條件的店家。<br><small>換個地區、狀態或星級看看。</small></div>`;
      return;
    }

    const groups = new Map();
    for (const p of list) {
      const key = p.city || '待分類';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }

    const forceExpanded = !!searchTerm || activeCity !== '全部';
    const cities = [...groups.keys()];
    const jump = cities.length > 1
      ? `<div class="city-jump">${cities.map(city => `<button class="jump-chip" data-jump-city="${escapeAttr(city)}">${escapeHtml(city)} · ${groups.get(city).length}</button>`).join('')}</div>`
      : '';

    els.placeList.innerHTML = jump + [...groups.entries()].map(([city, places]) => {
      const open = forceExpanded || expandedCities.has(city);
      const limit = searchTerm ? Infinity : (cityLimits.get(city) || 10);
      const shown = open ? places.slice(0, limit) : [];
      let more = '';

      if (open && !searchTerm && places.length > 10) {
        if (limit < places.length) {
          const label = limit < 30 && places.length > 30
            ? `顯示更多 · ${Math.min(30, places.length)} / ${places.length}`
            : `顯示全部 · ${places.length}`;
          more = `<button class="group-more" data-more-city="${escapeAttr(city)}">${label}</button>`;
        } else {
          more = `<button class="group-more" data-collapse-city="${escapeAttr(city)}">收合 ↑</button>`;
        }
      }

      return `
        <section class="place-group" id="city-${safeDomId(city)}">
          <div class="place-group-title">
            <button class="group-toggle ${open?'open':''}" data-toggle-city="${escapeAttr(city)}">
              <span>${escapeHtml(city)} · ${places.length}</span>
              <span class="group-arrow">⌄</span>
            </button>
          </div>
          ${open ? shown.map(renderPlaceItem).join('') + more : ''}
        </section>`;
    }).join('');

    els.placeList.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.edit)));
    els.placeList.querySelectorAll('[data-eaten]').forEach(btn => btn.addEventListener('click', () => toggleEaten(btn.dataset.eaten)));

    els.placeList.querySelectorAll('[data-toggle-city]').forEach(btn => btn.addEventListener('click', () => {
      const city = btn.dataset.toggleCity;
      if (expandedCities.has(city)) expandedCities.delete(city); else expandedCities.add(city);
      renderPlaces(getFilteredPlaces());
    }));

    els.placeList.querySelectorAll('[data-more-city]').forEach(btn => btn.addEventListener('click', () => {
      const city = btn.dataset.moreCity;
      const current = cityLimits.get(city) || 10;
      cityLimits.set(city, current < 30 ? 30 : Infinity);
      expandedCities.add(city);
      renderPlaces(getFilteredPlaces());
      requestAnimationFrame(() => document.getElementById('city-'+safeDomId(city))?.scrollIntoView({behavior:'smooth',block:'start'}));
    }));

    els.placeList.querySelectorAll('[data-collapse-city]').forEach(btn => btn.addEventListener('click', () => {
      const city = btn.dataset.collapseCity;
      cityLimits.set(city, 10);
      expandedCities.delete(city);
      renderPlaces(getFilteredPlaces());
      requestAnimationFrame(() => document.getElementById('city-'+safeDomId(city))?.scrollIntoView({behavior:'smooth',block:'start'}));
    }));

    els.placeList.querySelectorAll('[data-jump-city]').forEach(btn => btn.addEventListener('click', () => {
      const city = btn.dataset.jumpCity;
      expandedCities.add(city);
      renderPlaces(getFilteredPlaces());
      requestAnimationFrame(() => document.getElementById('city-'+safeDomId(city))?.scrollIntoView({behavior:'smooth',block:'start'}));
    }));
  }

  function safeDomId(v) {
    return encodeURIComponent(String(v || '')).replace(/%/g,'_');
  }

  function renderPlaceItem(p) {
    const eaten = p.eaten || hasList(p, '吃過');

          ${Number.isFinite(p.rating) ? `<span class="tag">Google ★ ${p.rating}${Number.isFinite(p.reviews) ? ` · ${p.reviews.toLocaleString('zh-TW')}` : ''}</span>` : ''}
          ${Number.isFinite(p.myRating) ? `<span class="tag hot">我的 ${'★'.repeat(p.myRating)}</span>` : ''}
          ${p.wouldReturn === 'yes' ? '<span class="tag eaten">會再吃</span>' : p.wouldReturn === 'no' ? '<span class="tag">不再吃</span>' : ''}
          ${hot ? '<span class="tag hot">推薦</span>' : ''}

      </div>

  }

  function pickToday(mode) {
    const candidates = getTodayCandidates();
    if (!candidates.length) { toast('目前沒有符合條件的店家'); return; }
    const fresh = candidates.filter(p => !isRecentEaten(p));
    const pool = fresh.length ? fresh : candidates;
    let pick;
    if (mode === 'random') pick = pool[Math.floor(Math.random() * pool.length)];
    else {
      const ranked = pool.map(p => ({ p, s: recommendationScore(p) })).sort((a,b) => b.s - a.s);
      const top = ranked.slice(0, Math.max(1, Math.ceil(ranked.length * .25)));
      pick = top[Math.floor(Math.random() * top.length)].p;
    }
    const reason = mode === 'random' ? '完全隨機抽選' : recommendationReason(pick);
    els.todayResult.classList.remove('empty');
    els.todayResult.innerHTML = `<div class="today-icon">${mode === 'random' ? '🎲' : '🔥'}</div>
      <div style="min-width:0;flex:1">
        <div class="today-name">${escapeHtml(pick.title)}</div>
        <p>${escapeHtml(pick.city || '待分類')} · ${escapeHtml(reason)}</p>
        <div class="today-meta">
          ${pick.eaten || hasList(pick,'吃過') ? '<span class="tag eaten">吃過</span>' : '<span class="tag">沒吃過</span>'}
          ${Number.isFinite(pick.myRating) ? `<span class="tag hot">我的 ${'★'.repeat(pick.myRating)}</span>` : ''}
          ${pick.wouldReturn === 'yes' ? '<span class="tag eaten">會再吃</span>' : ''}
          ${pick.url ? `<button class="chip" onclick="window.open('${escapeAttr(pick.url)}','_blank','noopener')">Google Maps ↗</button>` : ''}
          <button class="chip" data-edit="${escapeAttr(pick.id)}">評分 / 備註</button>
        </div>
      </div>`;
    const editBtn = els.todayResult.querySelector('[data-edit]');
    if (editBtn) editBtn.onclick = () => openEditModal(editBtn.dataset.edit);
  }

  function recommendationScore(p) {
    let s = 0;
    if (Number.isFinite(p.rating)) s += Math.max(0, p.rating - 3.5) * 34;
    if (Number.isFinite(p.reviews)) s += Math.log10(Math.max(1, p.reviews) + 1) * 14;
    if (Number.isFinite(p.myRating)) s += (p.myRating - 3) * 24;
    if (p.wouldReturn === 'yes') s += 28;
    if (p.wouldReturn === 'no') s -= 90;
    if (hasList(p, '555') || hasList(p, '五星')) s += 24;
    if (hasList(p, '最愛')) s += 20;
    if (hasList(p, '吃過的名店')) s += 12;
    if ((p.localNote || '').trim()) s += 2;
    if (isRecentEaten(p)) s -= 80;
    if (Number.isFinite(p.manualScore)) s += p.manualScore;
    return s;
  }

  function recommendationReason(p) {
    const r = [];
    if (Number.isFinite(p.myRating)) r.push(`你給 ${p.myRating}★`);
    if (p.wouldReturn === 'yes') r.push('你會再吃');
    if (Number.isFinite(p.rating)) r.push(`${p.rating}★${Number.isFinite(p.reviews) ? ' · ' + p.reviews.toLocaleString('zh-TW') + ' 則評論' : ''}`);
    if (!r.length) r.push('依目前條件綜合人氣推薦');
    return r.slice(0,2).join('＋');
  }

  async function handleZipSelect(e) {
    const file = e.target.files?.[0]; e.target.value = '';

  async function importTakeoutZip(file) {
    if (!file.name.toLowerCase().endsWith('.zip')) { toast('請選擇 ZIP 檔'); return; }
    els.modal.innerHTML = `<h3>正在解析…</h3><p class="modal-desc">${escapeHtml(file.name)}</p><div class="dropzone"><strong>讀取 Google Maps 收藏中</strong><p>不會上傳檔案。</p></div>`;
    openModal();
    try {
      const zip = await JSZip.loadAsync(file);
      const csvFiles = Object.values(zip.files).filter(x => !x.dir && x.name.toLowerCase().endsWith('.csv'));
      if (!csvFiles.length) throw new Error('這個 ZIP 裡沒有 CSV。請確認 Takeout 選的是「已儲存」。');

      const rows = [];
      for (const entry of csvFiles) {
        const text = await entry.async('string');
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        const listName = decodeListName(entry.name);
        for (const raw of parsed.data || []) rows.push(normalizeTakeoutRow(raw, listName));
      }

      const imported = buildTaiwanFoodPlaces(rows);
      const diff = diffImport(imported);
      showImportPreview(file.name, imported, diff, csvFiles.length);
    } catch (err) {
      els.modal.innerHTML = `<h3>無法匯入</h3><p class="modal-desc">${escapeHtml(err?.message || '解析失敗')}</p><div class="modal-actions"><button class="btn btn-ghost" id="closeModalBtn">關閉</button></div>`;
      document.getElementById('closeModalBtn').onclick = closeModal;
    }
  }

  function buildTaiwanFoodPlaces(rows) {
    const index = new Map();
    const cross = new Map();
    const crossNames = ['555 五星好評','吃過的名店','最愛的地點','想去的餐廳'];

    for (const r of rows) {
      const key = canonicalKey(r.url, r.title);
      if (!key) continue;
      if (!cross.has(key)) cross.set(key, new Set());
      if (crossNames.some(n => r.listName.includes(n))) cross.get(key).add(r.listName);
    }

    for (const r of rows) {
      if (!isPrimaryTaiwanFoodList(r.listName)) continue;
      const city = inferCityFromList(r.listName) || inferCityFromText([r.title,r.note,r.comment].join(' ')) || '待分類';
      const meta = CITY_META[city] || {};
      const key = canonicalKey(r.url, r.title); if (!key) continue;
      const coords = parseCoordinates(r.url);
      if (!index.has(key)) {
        index.set(key, {
          id: key, title: r.title || '未命名地點', url: r.url || '', note: r.note || '', comment: r.comment || '',
          sourceLists: [r.listName], city, region: meta.region || '待分類', lat: coords?.lat ?? null, lng: coords?.lng ?? null,
          eaten: false, localNote: '', manual: false, removed: false
        });
      } else {
        const p = index.get(key);
        if (!p.sourceLists.includes(r.listName)) p.sourceLists.push(r.listName);
        if (!p.note && r.note) p.note = r.note;
        if (!p.comment && r.comment) p.comment = r.comment;
      }
    }

    for (const [key, p] of index.entries()) {
      for (const name of cross.get(key) || []) if (!p.sourceLists.includes(name)) p.sourceLists.push(name);
    }

    return [...index.values()];
  }

  function isPrimaryTaiwanFoodList(name) {
    return /美食/.test(name) && !/新加坡|中國|比利時|日本|沖繩|東京/i.test(name);
  }

  function normalizeTakeoutRow(raw, listName) {
    const get = (...names) => {
      for (const n of names) {
        const k = Object.keys(raw).find(x => x.trim().toLowerCase() === n.toLowerCase());
        if (k && raw[k] != null) return String(raw[k]).trim();
      }
      return '';
    };
    return { listName, title: get('Title','名稱','標題'), note: get('Note','備註'), url: get('URL','Url','網址'), comment: get('Comment','Comments','留言','評論') };
  }

  function decodeListName(path) {
    const leaf = path.split('/').pop() || path;
    return leaf.replace(/\.csv$/i, '').trim();
  }

  function diffImport(imported) {
    const oldImported = state.places.filter(p => !p.manual);
    const old = new Map(oldImported.map(p => [p.id, p]));
    const neu = new Map(imported.map(p => [p.id, p]));
    let added = 0, updated = 0, removed = 0;
    for (const [id, p] of neu) {
      if (!old.has(id)) added++;
      else if (JSON.stringify((old.get(id).sourceLists||[]).slice().sort()) !== JSON.stringify((p.sourceLists||[]).slice().sort())) updated++;
    }
    for (const id of old.keys()) if (!neu.has(id)) removed++;
    return { added, updated, removed };
  }

  function applyImport(imported, fileName) {
    const old = new Map(state.places.map(p => [p.id, p]));
    const incomingIds = new Set(imported.map(p => p.id));
    const merged = imported.map(p => {
      const prev = old.get(p.id);
      return prev ? {
        ...p,
        eaten: !!prev.eaten,
        localNote: prev.localNote || '',
        myRating: Number.isFinite(prev.myRating) ? prev.myRating : null,
        wouldReturn: prev.wouldReturn || '',
        lastEatenAt: prev.lastEatenAt || null,
        city: prev.manualCity ? prev.city : p.city,
        region: prev.manualCity ? prev.region : p.region,
        manualCity: !!prev.manualCity,
        manualScore: prev.manualScore,
        removed: false
      } : p;
    });

    for (const p of state.places) {
      if (p.manual) merged.push(p);
      else if (!incomingIds.has(p.id)) merged.push({ ...p, removed: true });
    }

    state.places = dedupePlaces(merged);
    state.lastSync = new Date().toISOString();
    state.lastImportName = fileName;
    saveState(); renderAll();
  }

  function dedupePlaces(arr) {
    const map = new Map();
    for (const p of arr) {
      if (!map.has(p.id)) map.set(p.id, p);
      else {
        const a = map.get(p.id);
        a.sourceLists = [...new Set([...(a.sourceLists||[]), ...(p.sourceLists||[])])];
        a.localNote = a.localNote || p.localNote || '';
        a.eaten = a.eaten || p.eaten;
        a.myRating = Number.isFinite(a.myRating) ? a.myRating : p.myRating;
        a.wouldReturn = a.wouldReturn || p.wouldReturn || '';
        a.lastEatenAt = a.lastEatenAt || p.lastEatenAt || null;
      }
    }
    return [...map.values()];
  }

  function openEditModal(id = null) {
    const p = id ? state.places.find(x => x.id === id) : null;
    els.modal.innerHTML = `
      <h3>${p ? '編輯店家' : '手動新增'}</h3>
      <p class="modal-desc">吃過、我的評分、會不會再吃與備註都只存在你的裝置，可用「Google Maps 清單 → 匯出備份」保存。</p>
      <div class="field-grid">
        <div class="field full"><label>店名</label><input id="fTitle" value="${escapeAttr(p?.title || '')}" placeholder="例如：阿裕牛肉涮涮鍋" /></div>
        <div class="field full"><label>Google Maps 連結</label><input id="fUrl" value="${escapeAttr(p?.url || '')}" placeholder="https://maps.app.goo.gl/..." /></div>
        <div class="field"><label>城市 / 區域</label><select id="fCity">${cityOptions(p?.city || '台中')}</select></div>
        <div class="field"><label>狀態</label><select id="fStatus"><option value="一般">一般</option><option value="想去" ${hasList(p||{},'想去')?'selected':''}>想去</option><option value="五星" ${hasList(p||{},'五星')||hasList(p||{},'最愛')?'selected':''}>五星 / 最愛</option></select></div>
        <div class="field"><label>我的評分</label><select id="fMyRating">
          <option value="">未評分</option>
          ${[1,2,3,4,5].map(n => `<option value="${n}" ${p?.myRating===n?'selected':''}>${'★'.repeat(n)} ${n} 分</option>`).join('')}
        </select></div>
        <div class="field"><label>會不會再吃</label><select id="fWouldReturn">
          <option value="" ${!p?.wouldReturn?'selected':''}>未設定</option>
          <option value="yes" ${p?.wouldReturn==='yes'?'selected':''}>會再吃</option>
          <option value="no" ${p?.wouldReturn==='no'?'selected':''}>不會再吃</option>
        </select></div>
        <div class="field full"><label>我的備註</label><textarea id="fNote" placeholder="必點、停車、家人喜好…">${escapeHtml(p?.localNote || '')}</textarea></div>
        <div class="field full"><div class="check-row"><div><strong>吃過</strong><div class="muted-small">第一次標記會記錄日期；30 天內系統會降低推薦頻率。</div></div><input id="fEaten" type="checkbox" ${p?.eaten ? 'checked' : ''}/></div></div>
      </div>
      <div class="modal-actions">
        ${p ? '<button class="btn btn-danger" id="deleteBtn">刪除</button>' : ''}
        <button class="btn btn-ghost" id="closeModalBtn">取消</button>
        <button class="btn btn-primary" id="savePlaceBtn">儲存</button>
      </div>`;
    openModal();
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('savePlaceBtn').onclick = () => savePlaceForm(p);
    if (p) document.getElementById('deleteBtn').onclick = () => deletePlace(p.id);
  }

  function cityOptions(selected) {
    const cities = ['基隆','台北','新北','桃園','新竹','苗栗','大甲','清水','梧棲','沙鹿','台中','彰化','南投','雲林','嘉義','台南','高雄','屏東','宜蘭','花蓮','台東','東部','待分類'];
    return cities.map(c => `<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');
  }

  function savePlaceForm(existing) {
    const title = document.getElementById('fTitle').value.trim();
    const url = document.getElementById('fUrl').value.trim();
    const city = document.getElementById('fCity').value;
    const status = document.getElementById('fStatus').value;
    const localNote = document.getElementById('fNote').value.trim();
    const eaten = document.getElementById('fEaten').checked;
    const ratingRaw = document.getElementById('fMyRating').value;
    const myRating = ratingRaw ? Number(ratingRaw) : null;
    const wouldReturn = document.getElementById('fWouldReturn').value;
    if (!title) { toast('請輸入店名'); return; }
    const meta = CITY_META[city] || {};
    const coords = parseCoordinates(url);
    let sourceLists = existing?.sourceLists ? [...existing.sourceLists] : [];
    sourceLists = sourceLists.filter(x => !['手動：想去','手動：五星'].includes(x));
    if (status === '想去') sourceLists.push('手動：想去');
    if (status === '五星') sourceLists.push('手動：五星');
    const lastEatenAt = eaten ? (existing?.lastEatenAt || new Date().toISOString()) : null;

    if (existing) {
      Object.assign(existing, { title, url, city, region: meta.region || existing.region || '待分類', localNote, eaten, myRating, wouldReturn, lastEatenAt, sourceLists, manualCity: true,
        lat: coords?.lat ?? existing.lat ?? null, lng: coords?.lng ?? existing.lng ?? null, removed: false });
    } else {
      const id = canonicalKey(url, title) || `manual:${Date.now()}`;
      const same = state.places.find(x => x.id === id);
      if (same) { toast('這家店已經存在'); return; }
      state.places.push({ id, title, url, city, region: meta.region || '待分類', localNote, eaten, myRating, wouldReturn, lastEatenAt, sourceLists, manual: true, manualCity: true,
        note: '', comment: '', lat: coords?.lat ?? null, lng: coords?.lng ?? null, removed: false, forceFood: true });
    }
    saveState(); closeModal(); renderAll(); toast('已儲存');
  }

  function deletePlace(id) {
    const p = state.places.find(x => x.id === id); if (!p) return;
    if (p.manual) state.places = state.places.filter(x => x.id !== id);
    else p.removed = true;
    saveState(); closeModal(); renderAll(); toast('已從工具中移除');
  }

  function toggleEaten(id) {
    const p = state.places.find(x => x.id === id); if (!p) return;
    p.eaten = !p.eaten;
    p.lastEatenAt = p.eaten ? new Date().toISOString() : null;
    saveState(); renderAll(false);
  }

  function exportBackup() {
    const payload = {
      app: 'Taiwan Food Map',
      backupVersion: 1,
      exportedAt: new Date().toISOString(),
      state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `taiwan-food-map-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('備份已匯出');
  }

  async function restoreBackupFile(e) {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      const restored = raw?.state || raw;
      if (!restored || !Array.isArray(restored.places)) throw new Error('格式不正確');
      state = hydrateSharedData({ ...defaultState(), ...restored });
      saveState();
      closeModal();
      renderAll();
      toast('備份已還原');
    } catch (err) {
      toast('還原失敗：' + (err?.message || '檔案錯誤'));
    }
  }

  async function installApp() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    toast('若沒有跳出安裝視窗：Chrome 選單 → 加到主畫面');
  }

  function setupPwa() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  }

  function inferCityFromList(name) {
    for (const [needle, city] of FILENAME_CITY_RULES) if (name.includes(needle)) return city;
    return null;
  }

  function inferCityFromText(text) {
    if (!text) return null;
    for (const city of Object.keys(CITY_META)) if (text.includes(city)) return city;
    const aliases = [
      ['臺北','台北'],['臺中','台中'],['臺南','台南'],['臺東','台東'],
      ['北投','台北'],['信義','台北'],['士林','台北'],['板橋','新北'],['新店','新北'],
      ['西屯','台中'],['北屯','台中'],['南屯','台中'],['豐原','台中'],['龍井','台中'],['烏日','台中'],
      ['永康','台南'],['安平','台南'],['左營','高雄'],['苓雅','高雄']
    ];
    for (const [k,v] of aliases) if (text.includes(k)) return v;
    return null;
  }

  function parseCoordinates(url) {
    if (!url) return null;
    const patterns = [
      /@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/,
      /[?&](?:q|query|ll)=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/,
      /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/
    ];
    for (const re of patterns) {
      const m = url.match(re);
      if (m) return { lat: Number(m[1]), lng: Number(m[2]) };
    }
    return null;
  }

  function canonicalKey(url, title) {
    if (url) {
      try {
        const decoded = decodeURIComponent(url);
        let m = decoded.match(/[?&](?:ludocid|cid)=([0-9]+)/i); if (m) return `cid:${m[1]}`;
        m = decoded.match(/!1s(0x[0-9a-f]+:0x[0-9a-f]+)/i); if (m) return `hex:${m[1].toLowerCase()}`;
        const u = new URL(url);
        ['utm_source','utm_medium','utm_campaign','g_st','entry','sa'].forEach(k => u.searchParams.delete(k));
        u.hash = '';
        return `url:${u.toString().replace(/\/$/,'')}`;
      } catch {}
    }
    const t = (title || '').trim().toLowerCase();
    return t ? `title:${t}` : null;
  }

  function hasList(p, needle) { return (p.sourceLists || []).some(x => String(x).includes(needle)); }
  function formatDateTime(iso) { try { return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)); } catch { return iso; } }
  function openModal() { els.modalBackdrop.classList.remove('hidden'); els.modalBackdrop.setAttribute('aria-hidden','false'); }
  function closeModal() { els.modalBackdrop.classList.add('hidden'); els.modalBackdrop.setAttribute('aria-hidden','true'); }
  function toast(msg) { const el = document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
  function escapeHtml(v='') { return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function escapeAttr(v='') { return escapeHtml(v).replace(/`/g,'&#96;'); }
})();

</script>
</body>
</html>
