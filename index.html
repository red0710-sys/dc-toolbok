<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="D.C Toolbox — All tools. One place." />
  <title>D.C TOOLBOX</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090909;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    body{min-height:100svh;display:flex;justify-content:center}
    main{width:min(100%,520px);padding:42px 18px 28px}
    header{padding:8px 4px 30px}
    .eyebrow{font-size:12px;letter-spacing:.22em;color:#777;margin-bottom:10px}
    h1{font-size:32px;line-height:1;margin:0;font-weight:750;letter-spacing:-.04em}
    .sub{margin:11px 0 0;color:#8b8b8b;font-size:14px}
    .grid{display:grid;gap:12px}
    .card{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;background:#121212;border:1px solid #242424;border-radius:20px;padding:19px 18px;min-height:92px;transition:.16s ease}
    .card:active{transform:scale(.985);background:#181818}
    .icon{width:48px;height:48px;border-radius:15px;background:#1c1c1c;display:grid;place-items:center;font-size:23px;flex:0 0 auto}
    .copy{min-width:0;flex:1}
    .title{font-size:17px;font-weight:680;letter-spacing:-.01em}
    .desc{font-size:12px;color:#7e7e7e;margin-top:5px}
    .arrow{font-size:21px;color:#666}
    footer{display:flex;justify-content:space-between;align-items:center;padding:28px 5px 4px;color:#555;font-size:11px}
    .sig{font-family:Georgia,serif;font-style:italic;letter-spacing:.08em;color:#777}
    @media(min-width:700px){main{padding-top:70px}.card:hover{background:#181818;border-color:#333;transform:translateY(-1px)}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">PERSONAL HUB</div>
    <h1>D.C TOOLBOX</h1>
    <p class="sub">All tools. One place.</p>
  </header>

  <section class="grid">
    <a class="card" href="https://family-week-table-david.red0710.chatgpt.site/" target="_blank" rel="noopener">
      <div class="icon">🍽️</div><div class="copy"><div class="title">Family Week</div><div class="desc">家庭一週生活工具</div></div><div class="arrow">›</div>
    </a>
    <a class="card" href="https://david-asset-helm.red0710.chatgpt.site/#wealth" target="_blank" rel="noopener">
      <div class="icon">⚓</div><div class="copy"><div class="title">Asset Helm</div><div class="desc">資產領航・投資管理</div></div><div class="arrow">›</div>
    </a>
    <a class="card" href="https://wealth-journey.floot.app/" target="_blank" rel="noopener">
      <div class="icon">📈</div><div class="copy"><div class="title">Wealth Journey</div><div class="desc">財富軌跡・長期資產紀錄</div></div><div class="arrow">›</div>
    </a>
    <a class="card" href="https://okinawa-trip-blue.vercel.app/" target="_blank" rel="noopener">
      <div class="icon">✈️</div><div class="copy"><div class="title">Okinawa Trip</div><div class="desc">沖繩行程規劃工具</div></div><div class="arrow">›</div>
    </a>
  </section>

  <footer><span>4 TOOLS</span><span class="sig">D.C</span></footer>
</main>
</body>
</html>
