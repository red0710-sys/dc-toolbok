<!doctype html>
<html lang="zh-Hant">

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;
      background:
        radial-gradient(circle at 50% -10%,rgba(90,120,150,.16),transparent 36%),
        linear-gradient(180deg,#171b21 0%,#111419 100%);
      color:#f7f9fb;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif
    }
    body{min-height:100svh;display:flex;justify-content:center}
    main{width:min(100%,520px);padding:42px 18px 28px}
    header{padding:8px 4px 30px}
    .eyebrow{font-size:12px;letter-spacing:.22em;color:#9aa6b2;margin-bottom:10px}
    h1{
      font-size:32px;line-height:1;margin:0;font-weight:760;letter-spacing:-.04em;
      color:#fff;text-shadow:0 1px 18px rgba(255,255,255,.04)
    }
    .sub{margin:11px 0 0;color:#aeb7c1;font-size:14px}
    .grid{display:grid;gap:12px}
    .card{
      display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
      background:rgba(38,44,52,.92);
      border:1px solid rgba(255,255,255,.095);
      box-shadow:0 7px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.035);
      border-radius:20px;padding:19px 18px;min-height:92px;transition:.16s ease
    }
    .card:active{transform:scale(.985);background:#303741}
    .icon{
      width:48px;height:48px;border-radius:15px;
      background:linear-gradient(145deg,#39424d,#2c333c);
      border:1px solid rgba(255,255,255,.07);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
      display:grid;place-items:center;font-size:23px;flex:0 0 auto
    }
    .copy{min-width:0;flex:1}
    .title{font-size:17px;font-weight:690;letter-spacing:-.01em;color:#fff}
    .desc{font-size:12px;color:#adb7c2;margin-top:5px}
    .arrow{font-size:21px;color:#a5afba}
    footer{display:flex;justify-content:space-between;align-items:center;padding:28px 5px 4px;color:#88939f;font-size:11px}
    .sig{font-family:Georgia,serif;font-style:italic;letter-spacing:.08em;color:#a0aab5}
    @media(min-width:700px){
      main{padding-top:70px}
      .card:hover{
        background:#303741;border-color:rgba(255,255,255,.16);
        transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.2)
      }
    }
  </style>
</head>
