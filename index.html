<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070809" />
  <meta name="description" content="D.C Toolbox — Tools for a Better Life." />
  <title>D.C TOOLBOX</title>
  <style>
    :root{
      --bg:#070809;
      --panel:#111214;
      --panel2:#151618;
      --text:#f5f6f7;
      --muted:#8e939a;
      --line:#2a2c30;
      --accent:#ff8a00;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    body{
      min-height:100svh;
      display:flex;
      justify-content:center;
      background:
        radial-gradient(circle at 50% -10%,rgba(255,138,0,.08),transparent 30%),
        linear-gradient(180deg,#090a0c 0%,#050607 100%);
    }
    main{width:min(100%,620px);padding:34px 18px calc(28px + env(safe-area-inset-bottom))}
    header{padding:8px 4px 24px}
    .eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;color:#858a91;margin-bottom:12px}
    .eyebrow:after{content:"";width:34px;height:1px;background:var(--accent)}
    h1{font-size:34px;line-height:1;margin:0;font-weight:780;letter-spacing:-.04em}
    h1 span{color:var(--accent)}
    .sub{margin:12px 0 0;color:#a5a9af;font-size:14px}
    .hint{margin:10px 0 0;color:#777c83;font-size:11px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      aspect-ratio:1/1;
      min-width:0;
      overflow:hidden;
      text-decoration:none;
      color:inherit;
      border-radius:18px;
      padding:17px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.028),transparent 42%),
        linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid var(--line);
      box-shadow:0 10px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.03);
      transition:transform .16s ease,border-color .16s ease,background .16s ease,opacity .16s ease;
      touch-action:manipulation;
    }
    .card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .card:active{transform:scale(.985)}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .symbol{
      width:50px;height:50px;display:grid;place-items:center;color:var(--accent);
    }
    .symbol svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .copy{margin-top:14px;min-width:0}
    .title{font-size:clamp(14px,3.7vw,18px);line-height:1.12;font-weight:720;letter-spacing:-.02em;overflow-wrap:anywhere}
    .zh{font-size:14px;font-weight:700;color:var(--accent);margin-top:6px}
    .desc{font-size:11px;line-height:1.45;color:var(--muted);margin-top:7px}
    .foot{display:flex;align-items:center;justify-content:flex-end;margin-top:8px}
    .arrow{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,138,0,.30);color:var(--accent);font-size:16px;margin:0 2px 2px 0}
    footer{display:flex;justify-content:space-between;align-items:center;padding:24px 5px 2px;color:#80858c;font-size:10px;letter-spacing:.12em}
    .sig{font-family:Georgia,serif;font-style:italic;letter-spacing:.08em;color:#90959c}
    @media(max-width:620px){
      .card{aspect-ratio:auto;min-height:190px}
    }
    @media(max-width:390px){
      main{padding-left:12px;padding-right:12px}
      .grid{gap:9px}
      .card{padding:14px;border-radius:16px}
      .symbol{width:44px;height:44px}
      .symbol svg{width:40px;height:40px}
      .desc{font-size:10px}
    }
    @media(min-width:700px){
      main{padding-top:58px}
      .card:hover{transform:translateY(-2px);border-color:#383b40}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
